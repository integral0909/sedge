name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        rust: [stable]
        include:
          - os: ubuntu-24.04
            rust: "1.82"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo test --workspace

  mutation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Damage every program 1000 times
        run: cargo test --release -p sedge --test robustness
        env:
          SEDGE_MUTATIONS: "1000"

  examples:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Run the examples and benchmarks
        run: |
          set -e
          s=target/release/sedge
          for f in examples/json.sg examples/life.sg examples/sudoku.sg examples/brainfuck.sg; do
            echo "== $f"; $s run "$f" > /dev/null
          done
          $s run examples/nbody.sg 1000 | tee nbody.out
          grep -qx -- '-0.169075164' nbody.out
          grep -qx -- '-0.169087605' nbody.out
          $s run examples/raytracer.sg 32 | head -2
          $s run examples/wordfreq.sg README.md
          for b in bench/*.sg; do echo "== $b"; /usr/bin/time -p $s run "$b"; done
          $s test tests/run/tests_blocks.sg
          printf 'let x = 2\nx * 21\n:quit\n' | $s repl | grep -q '42 : Int'
